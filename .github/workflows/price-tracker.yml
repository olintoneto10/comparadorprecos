name: Rastreador de Precos

on:
  workflow_dispatch:

jobs:
  rastrear:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install --no-cache-dir -r requirements.txt

      - name: Executar rastreador
        timeout-minutes: 45
        env:
          BESTBUY_API_KEY:   ${{ secrets.BESTBUY_API_KEY }}
          SCRAPER_API_KEY:   ${{ secrets.SCRAPER_API_KEY }}
          ML_APP_ID:         ${{ secrets.ML_APP_ID }}
          ML_SECRET_KEY:     ${{ secrets.ML_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWESOMEAPI_TOKEN:  ${{ secrets.AWESOMEAPI_TOKEN }}
          AMAZON_TAG_US:     ${{ secrets.AMAZON_TAG_US }}
          AMAZON_TAG_BR:     ${{ secrets.AMAZON_TAG_BR }}
          ML_MATT_WORD:      ${{ secrets.ML_MATT_WORD }}
          ML_MATT_TOOL:      ${{ secrets.ML_MATT_TOOL }}
        run: python compras/tracker.py

      - name: Validar JSON gerado
        run: python -c 'import json,sys; d=json.load(open("compras/precos.json")); assert "items" in d and "cambio" in d; print("JSON valido:", len(d["items"]), "produtos")'

      - name: Commit dos precos atualizados
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add compras/precos.json
          git diff --staged --quiet || git commit -m "chore: precos atualizados $(date -u '+%Y-%m-%d')"
          git pull --rebase -X theirs origin master
          git push

      - name: Abrir alerta de queda de preco
        if: hashFiles('compras/alerta.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create alerta-preco --color E11D48 --description "Queda de preco detectada" 2>/dev/null || true
          gh issue create --title "$(cat compras/alerta_titulo.txt)" --body-file compras/alerta.md --label alerta-preco
